# Executes once when this workflow file changes.
name: Restrict Gemini to existing tags

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restrict-gemini-tags.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restrict tags to library catalogue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gemini = Path('backend/cmd/api/gemini.go')
          text = gemini.read_text()

          anchor = '''\tif len(in.Fields) > 100 {
\t\twriteError(w, http.StatusBadRequest, "La biblioteca tiene demasiados campos para el análisis.")
\t\treturn
\t}

'''
          replacement = anchor + '''\texistingTags, err := a.existingTagNames(r.Context(), groupID)
\tif err != nil {
\t\twriteError(w, http.StatusInternalServerError, "No se pudieron cargar las etiquetas de la biblioteca.")
\t\treturn
\t}

'''
          if 'existingTags, err := a.existingTagNames' not in text:
              if anchor not in text:
                  raise SystemExit('Gemini validation anchor not found')
              text = text.replace(anchor, replacement, 1)

          old_prompt = '''Genera entre 6 y 12 etiquetas temáticas concretas y reutilizables. Evita etiquetas genéricas como recurso, tutorial, vídeo, documento o contenido.
Para fieldValues usa únicamente fieldId y optionIds que existan en la lista proporcionada. Si no hay evidencia suficiente, omite ese campo.

URL: %s
Título actual: %s
Descripción actual: %s
Proveedor actual: %s
Tipo actual: %s
Campos configurables: %s`, in.URL, in.Title, in.Description, in.Provider, in.ResourceType, string(fieldJSON))'''
          new_prompt = '''Para tags usa exclusivamente valores exactos de la lista de etiquetas existentes. No inventes, traduzcas, reformules ni crees etiquetas nuevas. Si ninguna encaja, devuelve una lista vacía.
Para fieldValues usa únicamente fieldId y optionIds que existan en la lista proporcionada. Si no hay evidencia suficiente, omite ese campo.

URL: %s
Título actual: %s
Descripción actual: %s
Proveedor actual: %s
Tipo actual: %s
Etiquetas existentes: %s
Campos configurables: %s`, in.URL, in.Title, in.Description, in.Provider, in.ResourceType, strings.Join(existingTags, ", "), string(fieldJSON))'''
          if old_prompt not in text:
              raise SystemExit('Gemini prompt block not found')
          text = text.replace(old_prompt, new_prompt, 1)

          old_schema = '''\t\t\t"tags":         map[string]any{"type": "array", "items": map[string]any{"type": "string"}, "minItems": 6, "maxItems": 12},'''
          new_schema = '''\t\t\t"tags":         tagResponseSchema(existingTags),'''
          if old_schema not in text:
              raise SystemExit('Gemini tags schema not found')
          text = text.replace(old_schema, new_schema, 1)

          text = text.replace('validateEnrichment(&out, in)', 'validateEnrichment(&out, in, existingTags)', 1)
          text = text.replace('func validateEnrichment(out *enrichResponse, in enrichRequest) {', 'func validateEnrichment(out *enrichResponse, in enrichRequest, existingTags []string) {', 1)

          old_validation = '''\tseenTags := map[string]bool{}
\tcleanTags := make([]string, 0, len(out.Tags))
\tfor _, tag := range out.Tags {
\t\ttag = strings.TrimSpace(tag)
\t\tkey := strings.ToLower(tag)
\t\tif tag == "" || seenTags[key] || len([]rune(tag)) > 50 {
\t\t\tcontinue
\t\t}
\t\tseenTags[key] = true
\t\tcleanTags = append(cleanTags, tag)
\t\tif len(cleanTags) == 12 {
\t\t\tbreak
\t\t}
\t}
\tout.Tags = cleanTags
'''
          new_validation = '''\tallowedTags := make(map[string]string, len(existingTags))
\tfor _, tag := range existingTags {
\t\tallowedTags[strings.ToLower(strings.TrimSpace(tag))] = tag
\t}
\tseenTags := map[string]bool{}
\tcleanTags := make([]string, 0, len(out.Tags))
\tfor _, tag := range out.Tags {
\t\tkey := strings.ToLower(strings.TrimSpace(tag))
\t\tcanonical, allowed := allowedTags[key]
\t\tif !allowed || seenTags[key] {
\t\t\tcontinue
\t\t}
\t\tseenTags[key] = true
\t\tcleanTags = append(cleanTags, canonical)
\t\tif len(cleanTags) == 12 {
\t\t\tbreak
\t\t}
\t}
\tout.Tags = cleanTags
'''
          if old_validation not in text:
              raise SystemExit('Gemini tag validation block not found')
          text = text.replace(old_validation, new_validation, 1)

          helper_anchor = 'func callGemini('
          helpers = '''func (a *api) existingTagNames(ctx context.Context, groupID string) ([]string, error) {
\trows, err := a.db.Query(ctx, `
\t\tSELECT name
\t\tFROM tags
\t\tWHERE group_id=$1 AND BTRIM(name) <> ''
\t\tORDER BY LOWER(BTRIM(name)), created_at, id
\t\tLIMIT 200`, groupID)
\tif err != nil {
\t\treturn nil, err
\t}
\tdefer rows.Close()
\ttags := make([]string, 0)
\tseen := map[string]bool{}
\tfor rows.Next() {
\t\tvar name string
\t\tif err := rows.Scan(&name); err != nil {
\t\t\treturn nil, err
\t\t}
\t\tname = strings.TrimSpace(name)
\t\tkey := strings.ToLower(name)
\t\tif name != "" && !seen[key] {
\t\t\tseen[key] = true
\t\t\ttags = append(tags, name)
\t\t}
\t}
\treturn tags, rows.Err()
}

func tagResponseSchema(tags []string) map[string]any {
\titems := map[string]any{"type": "string"}
\tif len(tags) > 0 {
\t\titems["enum"] = tags
\t}
\treturn map[string]any{"type": "array", "items": items, "maxItems": 12}
}

'''
          if 'func (a *api) existingTagNames' not in text:
              if helper_anchor not in text:
                  raise SystemExit('Gemini helper anchor not found')
              text = text.replace(helper_anchor, helpers + helper_anchor, 1)
          gemini.write_text(text)

          resources = Path('backend/cmd/api/configurable_resources.go')
          text = resources.read_text()
          old_save = '''\t\tnormalizedTag := strings.ToLower(strings.TrimSpace(tagName))
\t\tvar tagID string
\t\terr := tx.QueryRow(r.Context(), `
\t\t\tSELECT id
\t\t\tFROM tags
\t\t\tWHERE group_id=$1 AND LOWER(BTRIM(normalized_name))=$2
\t\t\tORDER BY created_at, id
\t\t\tLIMIT 1`, groupID, normalizedTag).Scan(&tagID)
\t\tif err == pgx.ErrNoRows {
\t\t\terr = tx.QueryRow(r.Context(), `
\t\t\t\tINSERT INTO tags(group_id,name,normalized_name)
\t\t\t\tVALUES($1,$2,$3)
\t\t\t\tRETURNING id`, groupID, tagName, normalizedTag).Scan(&tagID)
\t\t}
\t\tif err != nil {
\t\t\twriteError(w, http.StatusInternalServerError, "could not save tag")
\t\t\treturn
\t\t}
'''
          new_save = '''\t\tnormalizedTag := strings.ToLower(strings.TrimSpace(tagName))
\t\tvar tagID string
\t\terr := tx.QueryRow(r.Context(), `
\t\t\tSELECT id
\t\t\tFROM tags
\t\t\tWHERE group_id=$1 AND LOWER(BTRIM(name))=$2
\t\t\tORDER BY created_at, id
\t\t\tLIMIT 1`, groupID, normalizedTag).Scan(&tagID)
\t\tif err == pgx.ErrNoRows {
\t\t\tcontinue
\t\t}
\t\tif err != nil {
\t\t\twriteError(w, http.StatusInternalServerError, "could not read existing tag")
\t\t\treturn
\t\t}
'''
          if old_save not in text:
              raise SystemExit('Resource tag save block not found')
          resources.write_text(text.replace(old_save, new_save, 1))

          frontend = Path('frontend/js/gemini-enrich.js')
          text = frontend.read_text()
          start = text.index('function thematicTags(result) {')
          end = text.index('\nfunction applySuggestions(result) {', start)
          replacement = '''function thematicTags(result) {
  const tags = [];
  const seen = new Set();
  (Array.isArray(result.tags) ? result.tags : []).forEach(value => {
    const tag = normalizeTag(value);
    const key = tag.toLocaleLowerCase('es');
    if (!tag || seen.has(key)) return;
    seen.add(key);
    tags.push(tag);
  });
  return tags.slice(0, 12);
}
'''
          text = text[:start] + replacement + text[end:]
          frontend.write_text(text)

          html = Path('frontend/resources.html')
          text = html.read_text().replace('gemini-enrich.js?v=3', 'gemini-enrich.js?v=4')
          html.write_text(text)

          sw = Path('frontend/sw.js')
          text = sw.read_text().replace("biblioteca-enlaces-v22", "biblioteca-enlaces-v23")
          text = text.replace('gemini-enrich.js?v=3', 'gemini-enrich.js?v=4')
          sw.write_text(text)
          PY
      - name: Format and test
        working-directory: backend
        run: |
          gofmt -w ./cmd/api
          go test ./...
      - name: Verify frontend safety
        run: |
          node --check frontend/js/gemini-enrich.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/api/gemini.go backend/cmd/api/configurable_resources.go frontend/js/gemini-enrich.js frontend/resources.html frontend/sw.js
          git commit -m "Restrict Gemini suggestions to existing library tags"
          git push
