name: Conectar dashboard de recursos

on:
  push:
    branches: [main]
    paths:
      - "backend/cmd/api/resource_social.go"
      - ".github/workflows/connect-resource-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Insertar rutas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/cmd/api/configurable.go')
          text = path.read_text()
          anchor = '\tmux.Handle("POST /api/v1/groups/{groupID}/resources", a.requireAuth(http.HandlerFunc(a.createResource)))\n'
          routes = '''\tmux.Handle("GET /api/v1/groups/{groupID}/resource-dashboard", a.requireAuth(http.HandlerFunc(a.resourceDashboard)))
\tmux.Handle("GET /api/v1/groups/{groupID}/members", a.requireAuth(http.HandlerFunc(a.groupMembers)))
\tmux.Handle("PUT /api/v1/resources/{resourceID}/rating", a.requireAuth(http.HandlerFunc(a.rateResource)))
\tmux.Handle("GET /api/v1/resources/{resourceID}/comments", a.requireAuth(http.HandlerFunc(a.resourceComments)))
\tmux.Handle("POST /api/v1/resources/{resourceID}/comments", a.requireAuth(http.HandlerFunc(a.resourceComments)))
\tmux.Handle("PATCH /api/v1/resources/{resourceID}", a.requireAuth(http.HandlerFunc(a.updateResource)))
\tmux.Handle("DELETE /api/v1/resources/{resourceID}", a.requireAuth(http.HandlerFunc(a.deleteResource)))
'''
          if routes not in text:
              text = text.replace(anchor, anchor + routes)
          path.write_text(text)
          PY
      - name: Formatear y probar
        working-directory: backend
        run: |
          gofmt -w ./cmd/api
          go test ./...
      - name: Confirmar cambios
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/api/configurable.go backend/cmd/api/resource_social.go
          git commit -m "Conectar dashboard social de recursos"
          git push
